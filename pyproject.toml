[project]
name = "cad-project"
version = "0.2.0"
description = "Spec-Driven Development sample project: parametric Build123d models (mounting bracket, magnetic rifle mount)."
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.9",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "bd_warehouse>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
